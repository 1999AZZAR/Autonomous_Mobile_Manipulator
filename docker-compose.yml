services:
  # The ROS 2 Simulation Service
  ros2-sim:
    build:
      context: ./ros2_ws
      dockerfile: Dockerfile
    container_name: ros2_sim_container
    # Launch ROS2 automation services
    command: >
      bash -c "
      source /opt/ros/jazzy/setup.bash &&
      cd /root/ros2_ws &&
      echo 'Checking Python dependencies...' &&
      pip3 install --break-system-packages -r src/my_robot_automation/requirements.txt &&
      echo 'Building robot packages...' &&
      timeout 300 colcon build --packages-select my_robot_description my_robot_bringup my_robot_automation --event-handlers console_direct+ &&
      if [ $? -eq 0 ]; then
        source install/setup.bash &&
        echo 'Packages built successfully' &&
        echo 'Starting Robot Control System...' &&
        python3 /root/ros2_ws/src/my_robot_automation/scripts/main.py --simulation &
        sleep 3 &&
        echo 'Services started. Web UI + API: http://localhost:8001' &&
        tail -f /dev/null
      else
        echo 'Build failed - starting with existing packages' &&
        source install/setup.bash &&
        python3 /root/ros2_ws/src/my_robot_automation/scripts/main.py --simulation &
        sleep 3 &&
        echo 'Services started. Web UI + API: http://localhost:8001' &&
        tail -f /dev/null
      fi
      "
    volumes:
      - ./ros2_ws/src:/root/ros2_ws/src
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=1
      - GAZEBO_MODEL_PATH=/root/ros2_ws/src/my_robot_description/models
      - PYTHONPATH=/root/ros2_ws/install/my_robot_automation/lib/python3.12/site-packages
      - FLASK_PORT=8001
    privileged: true
    network_mode: "host"
    ports:
      - "8001:8001" # Web UI and REST API
      - "8765:8765" # WebSocket server
